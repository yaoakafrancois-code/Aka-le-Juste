name: Tests, installateurs et publication

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test tests

  windows:
    name: Installateur et version portable Windows
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q nsis
      - run: python outils/construire_portable.py --installateur
      - uses: actions/upload-artifact@v4
        with:
          name: CacaoCoop-windows
          path: |
            dist/CacaoCoop-portable-windows.zip
            dist/Installer-CacaoCoop.exe
          retention-days: 30

  android:
    name: Application Android
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Clé de signature personnalisée (si les secrets existent)
        env:
          CACAO_KEYSTORE_BASE64: ${{ secrets.CACAO_KEYSTORE_BASE64 }}
        if: env.CACAO_KEYSTORE_BASE64 != ''
        run: echo "$CACAO_KEYSTORE_BASE64" | base64 -d > android/app/cle-privee.keystore
      - name: Construire l'APK
        env:
          CACAO_KEYSTORE_FILE: ${{ secrets.CACAO_KEYSTORE_BASE64 != '' && 'cle-privee.keystore' || '' }}
          CACAO_KEYSTORE_PASSWORD: ${{ secrets.CACAO_KEYSTORE_PASSWORD }}
          CACAO_KEY_ALIAS: ${{ secrets.CACAO_KEY_ALIAS }}
          CACAO_KEY_PASSWORD: ${{ secrets.CACAO_KEY_PASSWORD }}
        run: |
          gradle -p android assembleRelease --no-daemon
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/CacaoCoop-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CacaoCoop-android
          path: dist/CacaoCoop-android.apk
          retention-days: 30

  verifier-windows:
    name: Vérification sur un vrai Windows
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CacaoCoop-windows
      - name: Version portable
        shell: pwsh
        run: |
          Expand-Archive CacaoCoop-portable-windows.zip -DestinationPath portable
          cd portable\CacaoCoop
          .\python\python.exe manage.py migrate -v 0
          .\python\python.exe manage.py check
      - name: Installation silencieuse, démarrage, assistant, désinstallation
        shell: pwsh
        run: |
          Start-Process -Wait .\Installer-CacaoCoop.exe -ArgumentList "/S"
          $dossier = "$env:LOCALAPPDATA\CacaoCoop"
          if (-not (Test-Path "$dossier\python\python.exe")) { throw "Installation incomplète" }
          if (-not (Test-Path "$env:USERPROFILE\Desktop\CacaoCoop.lnk")) { throw "Raccourci du bureau absent" }
          $serveur = Start-Process -PassThru -WorkingDirectory $dossier "$dossier\python\python.exe" -ArgumentList "lancer.py","--sans-navigateur"
          Start-Sleep -Seconds 12
          $r = Invoke-WebRequest http://127.0.0.1:8000/ -UseBasicParsing -TimeoutSec 60
          if ($r.Content -notmatch "Bienvenue dans CacaoCoop") { throw "Assistant d'installation absent" }
          $c = Invoke-WebRequest http://127.0.0.1:8000/static/css/app.css -UseBasicParsing -TimeoutSec 60
          if ($c.StatusCode -ne 200) { throw "Fichiers statiques inaccessibles" }
          Stop-Process -Id $serveur.Id -Force
          Start-Sleep -Seconds 2
          if (-not (Test-Path "$dossier\data\cacaocoop.sqlite3")) { throw "Base de données non créée" }
          Start-Process -Wait "$dossier\Desinstaller.exe" -ArgumentList "/S","_?=$dossier"
          if (Test-Path "$dossier\python") { throw "Programme non désinstallé" }
          if (-not (Test-Path "$dossier\data\cacaocoop.sqlite3")) { throw "Les données auraient dû être conservées" }
          Write-Output "Installateur OK sous Windows"

  publier:
    name: Publier la version (page Releases)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verifier-windows, android]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: CacaoCoop ${{ github.ref_name }}
          body_path: outils/notes_version.md
          files: |
            dist/Installer-CacaoCoop.exe
            dist/CacaoCoop-portable-windows.zip
            dist/CacaoCoop-android.apk
            GUIDE_INSTALLATION.md
